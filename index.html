<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Article Preview Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="card-image">
      <img src="images/drawers.jpg" alt="Furniture Image" />
    </div>
    <div class="card-content">
      <h1>
        Shift the overall look and feel by adding these wonderful touches to furniture in your home
      </h1>
      <p>
        Ever been in a room and felt like something was missing? Perhaps it felt slightly bare and uninviting.
        I’ve got some simple tips to help you make any room feel complete.
      </p>
      <div class="card-footer">
        <div class="author">
          <img src="images/avatar-michelle.jpg" alt="Michelle Appleton" />
          <div class="author-info">
            <span>Michelle Appleton</span>
            <small>28 Jun 2020</small>
          </div>
        </div>
        <div class="share-section">
          <button id="shareBtn" class="share-btn">
            <img src="images/icon-share.svg" alt="Share icon" />
          </button>
          <div id="sharePopup" class="share-popup">
            <span>SHARE</span>
            <a href="#"><img src="images/icon-facebook.svg" alt="Facebook" /></a>
            <a href="#"><img src="images/icon-twitter.svg" alt="Twitter" /></a>
            <a href="#"><img src="images/icon-pinterest.svg" alt="Pinterest" /></a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
